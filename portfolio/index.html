<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ec" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("aditya-portfolio-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#000000" : "#f5f3ec";
      })();
    </script>
    <meta
      name="description"
      content="Aditya Dudeja — a builder at BITS Pilani, Goa exploring graphics, machine learning, and robotics. From the maths underneath to the worlds on screen."
    />
    <meta
      property="og:title"
      content="Aditya Dudeja — Curiosity. Built from scratch."
    />
    <meta
      property="og:description"
      content="Graphics, machine learning, and things that move. Explore the work and experiments of Aditya Dudeja."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/social.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/dm-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Aditya Dudeja — Engineer & Builder</title>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
